<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный кабинет — демо</title>
<link rel="stylesheet" href="common.css">
<style>
  /* Демонстрационная имитация экрана мобильного приложения сотрудника — не претендует на
     точное повторение внешнего вида боевого приложения, только состав и логику полей:
     что сотрудник может редактировать сам (Готовность к релокации, Куда хочу развиваться)
     и что подтягивается из реестра автоматически, только на чтение (Пройдённое обучение,
     Пройдена оценка SOFT) — построчно по каждому его треку развития. */
  body{ background:var(--bg-page); }
  .demo-banner{
    background:#fff7e0; color:#8a6100; font-size:12.5px; padding:9px 20px; text-align:center;
    border-bottom:1px solid #f0e0ad;
  }
  .demo-banner a{ color:#8a6100; font-weight:700; }
  .phone-wrap{
    max-width:420px; margin:0 auto; min-height:calc(100vh - 40px); background:#fff;
    box-shadow:0 0 40px rgba(15,15,40,0.08);
  }
  /* На реальном телефоне (а не в превью на десктопе) — во всю ширину экрана, без теней
     и белых полей по бокам, которые тут только мешают */
  @media (max-width:460px){
    .phone-wrap{ max-width:100%; box-shadow:none; min-height:100vh; }
    .demo-banner{ font-size:11.5px; padding:8px 14px; }
  }
  .profile-header{
    background:linear-gradient(135deg, var(--grad-a) 0%, var(--grad-b) 55%, var(--grad-c) 100%);
    color:#fff; padding:22px 20px 26px; text-align:center; position:relative;
  }
  .profile-header-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .profile-back{ color:#fff; text-decoration:none; font-size:20px; opacity:.85; }
  .profile-back:hover{ opacity:1; }
  .profile-settings{ opacity:.6; font-size:18px; }
  .profile-avatar{
    width:76px; height:76px; border-radius:50%; background:rgba(255,255,255,0.15);
    display:flex; align-items:center; justify-content:center; margin:6px auto 12px;
    font-size:26px; font-weight:700; border:2px solid rgba(255,255,255,0.4);
  }
  .profile-name{ font-size:18px; font-weight:700; }

  .section{ padding:18px 20px; border-bottom:8px solid var(--bg-page); }
  .section-title{ font-size:14.5px; font-weight:700; margin:0 0 12px; color:var(--ink); }
  .field-row{ display:flex; gap:12px; align-items:flex-start; padding:9px 0; }
  .field-icon{
    width:34px; height:34px; border-radius:9px; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:15px;
  }
  .field-body{ flex:1; min-width:0; }
  .field-label{ font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; color:var(--ink); }
  .field-value{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

  /* Карандаш — настоящая кнопка входа в режим редактирования, а не декоративная иконка.
     Само значение (select/чекбоксы) больше не лежит прямо на странице, где случайный тап
     при скролле мог бы незаметно его поменять — редактирование открывается только через
     явный клик сюда, во всплывающей модалке. */
  .edit-pencil-btn{
    border:none; background:none; color:var(--accent); font-size:12px; cursor:pointer;
    padding:2px 4px; line-height:1; flex-shrink:0;
  }
  .edit-pencil-btn:hover{ opacity:.7; }

  .position-checklist{ display:flex; flex-direction:column; gap:12px; }
  .position-check-item{ display:flex; align-items:center; gap:10px; font-size:14px; color:var(--ink); cursor:pointer; }
  .position-check-item input{ width:18px; height:18px; accent-color:var(--accent); flex-shrink:0; }

  .track-list{ margin-top:4px; display:flex; flex-direction:column; gap:5px; }
  .track-line{ font-size:12.5px; display:flex; justify-content:space-between; gap:10px; }
  .track-line .pos{ color:var(--ink); }
  .track-line .val{ color:var(--ink-soft); white-space:nowrap; text-align:right; }
  .field-empty-note{ font-size:12px; color:var(--ink-soft); font-style:italic; }

  /* "Не хочу развиваться" — намеренно приглушённая, не похожа на основное действие: это
     затрагивает сразу всё, а не одно поле, случайное нажатие должно быть маловероятным.
     К тому же дальше всё равно обязательная модалка с причиной, так что сам по себе клик
     сюда ещё ничего не решает. */
  .decline-all-row{ padding:16px 0 4px; text-align:center; }
  .decline-all-btn{
    border:none; background:none; color:var(--ink-soft); font-size:12px;
    text-decoration:underline; cursor:pointer; font-family:inherit; padding:6px 10px;
  }
  .decline-all-btn:hover{ color:#c81e3a; }

  .decline-modal-note{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin:0 0 12px; }
  .decline-reason-input{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:9px 10px; font-size:13.5px; font-family:inherit; color:var(--ink); resize:vertical;
  }
  .danger-btn{ background:#c81e3a; border-color:#c81e3a; }
  .danger-btn:hover{ background:#a8172f; border-color:#a8172f; }
  .danger-btn:disabled{ background:#e4a3ac; border-color:#e4a3ac; cursor:not-allowed; }

  /* ---------- МОДАЛКА РЕДАКТИРОВАНИЯ ---------- */
  /* Намеренно НЕ переключаем display:none/flex у этого элемента — на мобильном Chrome это
     известная причина, из-за которой position:fixed иногда "отвязывается" от вьюпорта и
     съезжает вместе с содержимым страницы вместо того, чтобы остаться прижатым к низу
     экрана. Вместо этого элемент всегда в DOM с display:flex, а видимость переключается
     через visibility/opacity — так контекст позиционирования не пересоздаётся каждый раз. */
  .edit-modal-overlay{
    display:flex; position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(15,15,40,0.45); align-items:flex-end; justify-content:center; z-index:30;
    visibility:hidden; opacity:0; transition:opacity .15s ease;
    transform:translateZ(0); -webkit-transform:translateZ(0); /* форсируем свой composite layer */
  }
  .edit-modal-overlay.open{ visibility:visible; opacity:1; }
  .edit-modal-card{
    background:#fff; width:100%; max-width:420px; border-radius:16px 16px 0 0;
    padding:18px 20px 22px; max-height:80vh; display:flex; flex-direction:column;
  }
  .edit-modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .edit-modal-head h3{ margin:0; font-size:15px; color:var(--ink); }
  .edit-modal-body{ overflow-y:auto; flex:1; }
  .edit-modal-select{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:9px 10px; font-size:14px; font-family:inherit; color:var(--ink); background:#fff;
  }
  .edit-modal-foot{ margin-top:16px; }
  .edit-modal-foot .primary-btn{ width:100%; justify-content:center; padding:11px; font-size:13.5px; }

  .ds-status-wrap{ position:fixed; bottom:12px; right:12px; z-index:20; }
  .ds-status-wrap .save-status{ box-shadow:0 4px 14px rgba(15,15,40,.12); }
</style>
</head>
<body>

<div class="demo-banner">
  Демо личного кабинета — изменения здесь сразу видны в <a href="index.html">реестре кадрового резерва</a>, и наоборот
</div>

<div class="phone-wrap">
  <div class="profile-header">
    <div class="profile-header-top">
      <a class="profile-back" href="index.html" title="К реестру">‹</a>
      <span class="profile-settings">⚙</span>
    </div>
    <div class="profile-avatar" id="avatarInitials">—</div>
    <div class="profile-name" id="profileName">Загрузка…</div>
  </div>

  <div class="section">
    <div class="section-title">Данные</div>
    <div class="field-row">
      <div class="field-icon">💼</div>
      <div class="field-body">
        <div class="field-label">Должность</div>
        <div class="field-value" id="profileCurPos">—</div>
      </div>
    </div>
    <div class="field-row">
      <div class="field-icon">✉</div>
      <div class="field-body">
        <div class="field-label">Email</div>
        <div class="field-value" id="profileEmail">—</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Карьерное развитие</div>

    <div class="field-row">
      <div class="field-icon">📍</div>
      <div class="field-body">
        <div class="field-label">
          Готовность к релокации
          <button type="button" class="edit-pencil-btn" id="editRelocBtn" title="Изменить">✎</button>
        </div>
        <div class="field-value" id="relocDisplay">—</div>
      </div>
    </div>

    <div class="field-row">
      <div class="field-icon">🎯</div>
      <div class="field-body">
        <div class="field-label">
          Куда хочу развиваться
          <button type="button" class="edit-pencil-btn" id="editPositionsBtn" title="Изменить">✎</button>
        </div>
        <div class="track-list" id="positionsDisplay"></div>
      </div>
    </div>

    <div class="field-row">
      <div class="field-icon">📈</div>
      <div class="field-body">
        <div class="field-label">Пройдённое обучение</div>
        <div class="track-list" id="trainingList"></div>
      </div>
    </div>

    <div class="field-row">
      <div class="field-icon">✅</div>
      <div class="field-body">
        <div class="field-label">Пройдена оценка SOFT</div>
        <div class="track-list" id="softList"></div>
      </div>
    </div>

    <div class="decline-all-row">
      <button type="button" class="decline-all-btn" id="declineAllBtn">Не хочу развиваться</button>
    </div>
  </div>
</div>

<div class="edit-modal-overlay" id="editModalOverlay">
  <div class="edit-modal-card">
    <div class="edit-modal-head">
      <h3 id="editModalTitle">Изменить</h3>
      <button class="modal-close" id="editModalClose">✕</button>
    </div>
    <div class="edit-modal-body" id="editModalBody"></div>
    <div class="edit-modal-foot">
      <button class="primary-btn" id="editModalDone">Готово</button>
    </div>
  </div>
</div>

<div class="edit-modal-overlay" id="declineModalOverlay">
  <div class="edit-modal-card">
    <div class="edit-modal-head">
      <h3 id="declineModalTitle">Не хочу развиваться</h3>
      <button class="modal-close" id="declineModalClose">✕</button>
    </div>
    <div class="edit-modal-body">
      <p class="decline-modal-note" id="declineModalNote"></p>
      <textarea class="decline-reason-input" id="declineReasonInput" rows="4" placeholder="Укажите причину…"></textarea>
    </div>
    <div class="edit-modal-foot">
      <button class="primary-btn danger-btn" id="declineConfirmBtn" disabled>Подтвердить отказ</button>
    </div>
  </div>
</div>

<div class="ds-status-wrap">
  <div class="save-status" id="saveStatus"><span class="save-dot"></span><span class="save-status-text">Загрузка…</span></div>
</div>

<script src="common.js"></script>
<script>
// Демо личного кабинета всегда показывает ОДНОГО заранее выбранного сотрудника — тот же
// человек, что curated-строки 1 и 2 в самом реестре (employeeId "emp1", специально
// поставлен первым в демо-данных, чтобы его было легко найти).
const DEMO_EMPLOYEE_ID = 'emp1';

let COLUMNS = [];
let positionCategories = [];
let reserveRows = [];
let employeePool = []; // сюда возвращается сотрудник, если у него не осталось ни одного
                        // активного/заблокированного трека — нужно для корректного
                        // отображения "отказался от всех направлений", а не ошибки

/** Дублирует одноимённую функцию из columns.js/index.html — серверный модуль недоступен
 *  напрямую в браузере, логика намеренно простая, держать в нескольких местах не накладно. */
function getEligiblePotentialPositions(currentPosition, categories){
  const eligible = new Set();
  (categories || []).forEach(cat => {
    if (Array.isArray(cat.currentPositions) && cat.currentPositions.includes(currentPosition)){
      (cat.potentialPositions || []).forEach(p => eligible.add(p));
    }
  });
  return Array.from(eligible);
}

/** Все строки этого сотрудника, которые вообще имеет смысл показывать в личном кабинете —
 *  удалённые (trackState:'removed') не в счёт, они больше не выбраны, ничего не отражают. */
function getMyRows(){
  return reserveRows.filter(r => r.values.employeeId === DEMO_EMPLOYEE_ID && r.values.trackState !== 'removed');
}

function render(){
  const myRows = getMyRows();
  const poolEntry = employeePool.find(p => p.employeeId === DEMO_EMPLOYEE_ID);

  if (myRows.length === 0 && !poolEntry){
    // по-настоящему нет данных вообще ни в резерве, ни в общем списке кандидатов — это
    // действительно нештатная ситуация, а не просто "отказался от всех направлений"
    document.getElementById('profileName').textContent = 'Демо-сотрудник не найден в текущих данных';
    return;
  }

  // личные данные (ФИО, должность, почта) — из любой активной строки; а если активных
  // треков нет вообще (сотрудник отказался от всех направлений и вернулся в общий список
  // кандидатов) — из записи в этом общем списке, у неё те же самые базовые поля
  const sample = myRows.length > 0 ? myRows[0].values : poolEntry;

  document.getElementById('profileName').textContent = sample.fio;
  document.getElementById('avatarInitials').textContent = (sample.fio || '').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  document.getElementById('profileCurPos').textContent = sample.curPos || '—';
  document.getElementById('profileEmail').textContent = sample.email || '—';

  // Готовность к релокации и Куда хочу развиваться — на самой странице только текстом,
  // без прямого select/чекбоксов: значение меняется только через явный клик по карандашу
  // и модалку (см. openRelocEditor/openPositionsEditor), чтобы случайный тап при скролле
  // не мог незаметно поменять выбор. Если активных треков нет вообще — редактировать пока
  // нечего (обе модалки сами проверяют это перед открытием), просто показываем "—".
  document.getElementById('relocDisplay').textContent = myRows.length > 0 ? (sample.relocReady || '—') : '—';

  const eligible = getEligiblePotentialPositions(sample.curPos, positionCategories);
  const activePositions = myRows.filter(r => r.values.trackState === 'active').map(r => r.values.potPos);
  const positionsDisplay = document.getElementById('positionsDisplay');
  if (activePositions.length === 0){
    positionsDisplay.innerHTML = `<div class="field-empty-note">Пока ничего не выбрано</div>`;
  } else {
    positionsDisplay.innerHTML = activePositions.map(pos => `<div class="track-line"><span class="pos">${escapeHtml(pos)}</span></div>`).join('');
  }

  // Пройдённое обучение — только на чтение, по каждому видимому треку: название программы
  // обучения (не должности!) + % прохождения из записи в devTracks, относящейся к активной
  // потенциальной должности этого трека
  const trainingList = document.getElementById('trainingList');
  if (myRows.length === 0){
    trainingList.innerHTML = `<div class="field-empty-note">Пока нет выбранных направлений</div>`;
  } else {
    trainingList.innerHTML = myRows.map(r => {
      const track = (r.values.devTracks || []).find(t => t.position === r.values.potPos);
      const pct = track && track.percent !== undefined ? track.percent : 0;
      const programName = track && track.program ? track.program : r.values.potPos;
      return `<div class="track-line"><span class="pos">${escapeHtml(programName)}</span><span class="val">${pct}%</span></div>`;
    }).join('');
  }

  // Пройдена оценка SOFT — тоже только на чтение, по каждому треку: должность + статус
  // из столбца "Оценка SOFT" именно этой строки (может отличаться между треками одного
  // и того же человека — это оценка применительно к конкретному направлению развития)
  const softList = document.getElementById('softList');
  if (myRows.length === 0){
    softList.innerHTML = `<div class="field-empty-note">—</div>`;
  } else {
    softList.innerHTML = myRows.map(r => `
      <div class="track-line"><span class="pos">${escapeHtml(r.values.potPos)}</span><span class="val">${escapeHtml(r.values.soft || '—')}</span></div>
    `).join('');
  }

  // "Не хочу развиваться" — отказываться не от чего, если активных треков нет вообще
  const hasActiveTracks = myRows.some(r => r.values.trackState === 'active');
  document.getElementById('declineAllBtn').style.display = hasActiveTracks ? '' : 'none';
  document.getElementById('editRelocBtn').style.display = hasActiveTracks ? '' : 'none';
  // "editPositionsBtn" НЕ скрываем даже без активных треков — это единственный способ
  // выбрать новое направление развития после того, как отказался от всех прежних

  // если модалка редактирования сейчас открыта — обновляем и её содержимое вместе с
  // остальной страницей (например, после того как чекбокс внутри неё сам вызвал reload())
  if (openEditorKind === 'reloc') renderRelocEditorBody(sample);
  if (openEditorKind === 'positions') renderPositionsEditorBody(sample, myRows);
}

/* ===================== МОДАЛКА РЕДАКТИРОВАНИЯ ===================== */
let openEditorKind = null; // null | 'reloc' | 'positions' — какая модалка сейчас открыта

function closeEditModal(){
  document.getElementById('editModalOverlay').classList.remove('open');
  openEditorKind = null;
}

function renderRelocEditorBody(sample){
  const relocCol = COLUMNS.find(c => c.key === 'relocReady');
  document.getElementById('editModalBody').innerHTML = `
    <select class="edit-modal-select" id="relocSelect">
      ${relocCol.options.map(o => `<option value="${escapeHtml(o)}" ${o === sample.relocReady ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('')}
    </select>
  `;
}

function openRelocEditor(){
  const myRows = getMyRows();
  if (myRows.length === 0) return;
  openEditorKind = 'reloc';
  document.getElementById('editModalTitle').textContent = 'Готовность к релокации';
  renderRelocEditorBody(myRows[0].values);
  document.getElementById('editModalOverlay').classList.add('open');
}

function renderPositionsEditorBody(sample, myRows){
  const eligible = getEligiblePotentialPositions(sample.curPos, positionCategories);
  const activePositions = new Set(myRows.filter(r => r.values.trackState === 'active').map(r => r.values.potPos));
  const body = document.getElementById('editModalBody');
  if (eligible.length === 0){
    body.innerHTML = `<div class="field-empty-note">Для должности «${escapeHtml(sample.curPos)}» пока не настроены доступные направления развития</div>`;
  } else {
    body.innerHTML = `<div class="position-checklist">${eligible.map(pos => `
      <label class="position-check-item">
        <input type="checkbox" data-position="${escapeHtml(pos)}" ${activePositions.has(pos) ? 'checked' : ''}>
        <span>${escapeHtml(pos)}</span>
      </label>
    `).join('')}</div>`;
  }
}

function openPositionsEditor(){
  const myRows = getMyRows();
  const poolEntry = employeePool.find(p => p.employeeId === DEMO_EMPLOYEE_ID);
  const sample = myRows.length > 0 ? myRows[0].values : poolEntry;
  if (!sample) return; // ни строк, ни записи в общем списке — действительно нечего показывать
  openEditorKind = 'positions';
  document.getElementById('editModalTitle').textContent = 'Куда хочу развиваться';
  renderPositionsEditorBody(sample, myRows);
  document.getElementById('editModalOverlay').classList.add('open');
}

async function reload(){
  const state = await fetchState();
  reserveRows = state.reserveRows;
  employeePool = state.employeePool;
  render();
}

function setupHandlers(){
  document.getElementById('editRelocBtn').addEventListener('click', openRelocEditor);
  document.getElementById('editPositionsBtn').addEventListener('click', openPositionsEditor);
  document.getElementById('editModalClose').addEventListener('click', closeEditModal);
  document.getElementById('editModalDone').addEventListener('click', closeEditModal);
  document.getElementById('editModalOverlay').addEventListener('click', e => {
    if (e.target.id === 'editModalOverlay') closeEditModal();
  });

  // делегирование — содержимое модалки (select/чекбоксы) каждый раз пересоздаётся заново,
  // поэтому слушатель вешаем один раз на сам контейнер тела модалки, а не на конкретные
  // элементы внутри него
  document.getElementById('editModalBody').addEventListener('change', async e => {
    const select = e.target.closest('#relocSelect');
    if (select){
      try{
        await mutate(`/api/employee/${encodeURIComponent(DEMO_EMPLOYEE_ID)}/reloc-ready`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value: select.value }),
        });
      } catch(err){
        // статус сохранения уже показал ошибку — перерисуем из последнего известного состояния
      }
      await reload();
      return;
    }

    const cb = e.target.closest('input[type="checkbox"]');
    if (!cb) return;
    const position = cb.dataset.position;
    if (cb.checked){
      try{
        await mutate('/api/reserve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ employeeId: DEMO_EMPLOYEE_ID, position }),
        });
      } catch(err){
        // статус сохранения уже показал ошибку
      }
      await reload();
    } else {
      // снятие галочки — тоже требует причину, как и "Не хочу развиваться", просто пишется
      // только в ЭТУ одну строку, а не во все сразу. Закрываем редактор должностей и
      // открываем модалку с причиной поверх него — после подтверждения/отмены редактор
      // можно будет открыть заново по тому же карандашу, уже с актуальным состоянием.
      const row = getMyRows().find(r => r.values.potPos === position && r.values.trackState === 'active');
      closeEditModal();
      if (row) openDeclineOneModal(row);
    }
  });

  /* ---------- "Не хочу развиваться" — целиком, или снятие одной галочки (см. обработчик
     чекбоксов выше) — общая модалка с причиной, отличается только тем, куда пишется
     результат: во все активные строки сразу, или только в одну конкретную. */
  const declineOverlay = document.getElementById('declineModalOverlay');
  const declineInput = document.getElementById('declineReasonInput');
  const declineConfirmBtn = document.getElementById('declineConfirmBtn');
  let declineMode = null;       // 'all' | 'one'
  let declineTargetRowId = null; // используется только в режиме 'one'

  function openDeclineModal(){
    const myRows = getMyRows().filter(r => r.values.trackState === 'active');
    if (myRows.length === 0) return; // отказываться не от чего
    declineMode = 'all';
    declineTargetRowId = null;
    document.getElementById('declineModalTitle').textContent = 'Не хочу развиваться';
    document.getElementById('declineModalNote').textContent =
      `Это уберёт сразу все ваши текущие направления развития (${myRows.map(r => r.values.potPos).join(', ')}). ` +
      `Пожалуйста, укажите причину — без неё отказ не сохранится.`;
    declineInput.value = '';
    declineConfirmBtn.disabled = true;
    declineOverlay.classList.add('open');
    declineInput.focus();
  }

  function openDeclineOneModal(row){
    declineMode = 'one';
    declineTargetRowId = row.id;
    document.getElementById('declineModalTitle').textContent = 'Убрать направление';
    document.getElementById('declineModalNote').textContent =
      `Вы снимаете направление «${row.values.potPos}» — остальные ваши направления это не затронет. ` +
      `Пожалуйста, укажите причину — без неё направление останется как есть.`;
    declineInput.value = '';
    declineConfirmBtn.disabled = true;
    declineOverlay.classList.add('open');
    declineInput.focus();
  }

  function closeDeclineModal(){
    declineOverlay.classList.remove('open');
    declineMode = null;
    declineTargetRowId = null;
  }

  document.getElementById('declineAllBtn').addEventListener('click', openDeclineModal);
  document.getElementById('declineModalClose').addEventListener('click', closeDeclineModal);
  declineOverlay.addEventListener('click', e => {
    if (e.target.id === 'declineModalOverlay') closeDeclineModal();
  });
  // подтвердить можно только если причина реально заполнена (не только пробелы) — это
  // обязательное условие, а не просто рекомендация
  declineInput.addEventListener('input', () => {
    declineConfirmBtn.disabled = declineInput.value.trim() === '';
  });
  declineConfirmBtn.addEventListener('click', async () => {
    const reason = declineInput.value.trim();
    if (!reason) return;
    declineConfirmBtn.disabled = true;
    try{
      if (declineMode === 'all'){
        await mutate(`/api/employee/${encodeURIComponent(DEMO_EMPLOYEE_ID)}/decline`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason }),
        });
      } else if (declineMode === 'one' && declineTargetRowId){
        await mutate(`/api/reserve/${encodeURIComponent(declineTargetRowId)}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason }),
        });
      }
    } catch(err){
      // статус сохранения уже показал ошибку — не закрываем модалку, пусть попробуют ещё раз
      declineConfirmBtn.disabled = false;
      return;
    }
    closeDeclineModal();
    await reload();
  });
}

async function init(){
  setSaveStatus('saving', 'Загрузка…');
  try{
    const meta = await fetchMeta();
    COLUMNS = meta.columns;
    const state = await fetchState();
    reserveRows = state.reserveRows;
    positionCategories = state.positionCategories;
    employeePool = state.employeePool;
  } catch(err){
    console.error(err);
    setSaveStatus('error', 'Нет связи с сервером');
    document.getElementById('profileName').textContent = 'Не удалось загрузить данные';
    return;
  }
  setSaveStatus('ok', 'Загружено');
  render();
  setupHandlers();
}

init();
</script>
</body>
</html>
