<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кадровый резерв — демо</title>
<link rel="stylesheet" href="common.css">
<style>
  /* ---------- HERO ---------- */
  .hero{
    background:#fff;
    padding:20px 32px 4px;
    position:relative;
  }
  .breadcrumb{
    color:var(--ink-soft);
    font-size:12.5px;
    letter-spacing:.02em;
    margin-bottom:14px;
  }
  .hero-top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:24px;
    flex-wrap:wrap;
    margin-bottom:20px;
  }
  .hero-title h1{
    color:var(--ink); margin:0 0 6px; font-size:24px; font-weight:700; letter-spacing:-0.01em;
  }
  .hero-title p{
    color:var(--ink-soft); margin:0; font-size:14px; max-width:560px; line-height:1.5;
  }

  .demo-badge{
    background:var(--auto-bg);
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-size:12px;
    padding:7px 12px;
    border-radius:999px;
    white-space:nowrap;
  }

  .widgets-section{
    background:var(--auto-bg);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:14px 16px;
    transition:background .2s ease;
  }
  /* "Старая" тёмная подложка — тот же градиент, что был до перехода на светлый дизайн
     портала. Меняет только фон самой секции виджетов и цвет текста тулбара, лежащего
     прямо на этом фоне — сами карточки виджетов и раньше, и сейчас белые, их внутренний
     вид трогать не нужно. */
  .widgets-section.theme-dark{
    background:linear-gradient(135deg, var(--grad-a) 0%, var(--grad-b) 55%, var(--grad-c) 100%);
    border-color:transparent;
  }
  .widgets-section.theme-dark .widgets-updated{ color:rgba(255,255,255,0.65); }
  .widgets-section.theme-dark .widgets-refresh-btn{
    color:#fff; background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.25);
  }
  .widgets-section.theme-dark .widgets-refresh-btn:hover{ background:rgba(255,255,255,0.18); }
  .widgets-toolbar{
    display:flex; align-items:center; justify-content:flex-end; gap:8px;
    margin-bottom:10px;
  }
  .widgets-updated{ font-size:12px; color:var(--ink-soft); margin-right:auto; transition:color .2s ease; }
  .widgets-refresh-btn{
    display:inline-flex; align-items:center; gap:7px;
    border:1px solid var(--line); border-radius:999px;
    padding:7px 14px; font-size:12.5px; font-family:inherit; font-weight:600;
    color:var(--ink); background:#fff; cursor:pointer;
    transition:background .15s ease, color .2s ease, border-color .2s ease;
  }
  .widgets-refresh-btn:hover{ background:var(--auto-bg); }
  .widgets-refresh-btn:active svg{ animation:spin .5s linear; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #toggleWidgetsIcon{ transition:transform .15s ease; }
  #toggleWidgetsIcon.collapsed{ transform:rotate(-90deg); }

  .widgets{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:12px;
  }
  @media (max-width:980px){ .widgets{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){ .widgets{grid-template-columns:1fr;} }
  /* "Кадровый резерв по должностям" — половина ширины (3 из 6 колонок), на всю высоту
     двух рядов слева */
  .card-tall{ grid-column:1 / span 3; grid-row:1 / span 2; }
  @media (max-width:980px){ .card-tall{ grid-column:1; grid-row:auto; } }
  /* "История назначений" — вторая половина ширины, первый ряд */
  .card-wide{ grid-column:4 / span 3; grid-row:1; }
  @media (max-width:980px){ .card-wide{ grid-column:1 / span 2; grid-row:auto; } }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:14px 16px;
    display:flex;
    flex-direction:column;
  }
  .card-body-center{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .card-label{
    font-size:12.5px; color:var(--ink); font-weight:500; margin-bottom:6px;
  }
  .card-label-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .card-label-row .card-label{ margin-bottom:0; }
  .card-label-selects{ display:flex; align-items:center; gap:6px; }
  .fy-select{
    border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--ink);
    font-size:11.5px; font-weight:600; padding:3px 9px; font-family:inherit; cursor:pointer;
  }
  .fy-select:focus{ outline:none; border-color:var(--accent); }
  .card-row{ display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .big-num{ font-size:24px; font-weight:800; letter-spacing:-0.01em; }
  .sub-num{ font-size:19px; font-weight:800; }
  .card-hint{ font-size:11px; color:var(--ink-soft); margin-top:4px; line-height:1.4; }

  /* КР по должностям — список "должность / количество", а не фиксированная сетка из 4,
     потому что реальный набор должностей теперь произвольный (берётся из данных).
     Полоска и число показывают долю резервистов от общего пула сотрудников компании,
     которые в принципе могут претендовать на эту должность (см. estimateEligiblePoolSize —
     в прототипе это оценка для демонстрации, не настоящий подсчёт по всей компании). */
  .position-list{ flex:1; display:flex; flex-direction:column; justify-content:space-evenly; gap:6px; }
  .position-row{ display:flex; align-items:center; gap:10px; }
  .position-row .p-label{ flex:1; font-size:12px; color:var(--ink-soft); }
  .position-row .p-track{ flex:1.4; height:10px; border-radius:999px; background:#eef0f4; overflow:hidden; }
  .position-row .p-fill{ height:100%; border-radius:999px; background:var(--accent); }
  .position-row .p-num{ min-width:56px; text-align:right; font-weight:700; color:var(--ink); font-size:12px; white-space:nowrap; }
  .position-row .p-num-total{ font-weight:500; color:var(--ink-soft); font-size:11px; }
  .position-empty{ font-size:12px; color:var(--ink-soft); }

  /* История назначений — простой столбчатый график на 12 месяцев, без внешних библиотек */
  .fy-chart{ display:flex; align-items:flex-end; gap:6px; height:76px; margin-top:2px; }
  .fy-bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:3px; }
  .fy-bar-val{ font-size:10px; color:var(--ink-soft); font-weight:700; min-height:12px; }
  .fy-bar{ width:100%; max-width:20px; border-radius:3px 3px 0 0; background:var(--accent); min-height:2px; }
  .fy-bar.zero{ background:#e3e4ea; }
  .fy-bar-month{ font-size:9.5px; color:var(--ink-soft); }

  /* Вакансии — карточка-ссылка на внешний портал */
  .vacancies-link-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--accent); color:#fff; text-decoration:none;
    border-radius:999px; padding:8px 16px; font-size:12px; font-weight:600;
    transition:background .15s ease;
  }
  .vacancies-link-btn:hover{ background:#122a52; }

  /* ---------- MAIN CONTENT ---------- */
  .content{ padding:4px 32px 60px; }
  .section-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:16px;}
  .section-head h2{ font-size:18px; margin:0; }
  .section-head p{ margin:2px 0 0; color:var(--ink-soft); font-size:13px; }

  .toolbar{
    background:var(--auto-bg);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:14px 16px;
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    margin-bottom:14px;
    transition:background .2s ease, border-color .2s ease;
  }
  /* Та же "старая" тёмная подложка, что и у секции виджетов (см. .widgets-section.theme-dark) —
     переключаются одной и той же кнопкой, чтобы не плодить два независимых тумблера ради
     одного и того же визуального решения. Поиск и разделитель не имеют своего непрозрачного
     фона — на тёмном градиенте их пришлось бы сделать полупрозрачными явно, иначе текст
     поиска слился бы с фоном. */
  .toolbar.theme-dark{
    background:linear-gradient(135deg, var(--grad-a) 0%, var(--grad-b) 55%, var(--grad-c) 100%);
    border-color:transparent;
  }
  .toolbar.theme-dark .search{
    background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.25);
  }
  .toolbar.theme-dark .search input{ color:#fff; }
  .toolbar.theme-dark .search input::placeholder{ color:rgba(255,255,255,0.55); }
  .toolbar.theme-dark .search svg{ color:#fff; }
  .toolbar.theme-dark .divider-v{ background:rgba(255,255,255,0.25); }
  .toolbar.theme-dark .ghost-btn{
    color:#fff; background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.25);
  }
  .toolbar.theme-dark .ghost-btn:hover{ background:rgba(255,255,255,0.18); border-color:rgba(255,255,255,0.4); }
  .search{
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--line); border-radius:999px; padding:8px 14px;
    min-width:220px; flex:0 0 auto;
    transition:background .2s ease, border-color .2s ease;
  }
  .search input{
    border:none; outline:none; font-size:13.5px; width:180px; background:transparent; color:var(--ink);
    transition:color .2s ease;
  }
  .search svg{ flex-shrink:0; opacity:.5; transition:color .2s ease; }

  .divider-v{ width:1px; height:22px; background:var(--line); margin:0 4px; transition:background .2s ease; }

  .toolbar-right{ margin-left:auto; display:flex; gap:8px; align-items:center;}

  /* table */
  .table-wrap{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    overflow:hidden;
  }
  .table-scroll-top{
    overflow-x:auto; overflow-y:hidden;
    height:18px;
    background:var(--auto-bg);
    border-bottom:1px solid var(--line);
  }
  .table-scroll-top::-webkit-scrollbar{ height:14px; }
  .table-scroll-top::-webkit-scrollbar-track{ background:var(--auto-bg); }
  .table-scroll-top::-webkit-scrollbar-thumb{ background:#c7c9d1; border-radius:999px; border:3px solid var(--auto-bg); }
  .table-scroll-top::-webkit-scrollbar-thumb:hover{ background:var(--accent); }
  .table-scroll-top #tableScrollTopInner{ height:1px; }
  .table-scroll{
    overflow:auto;
    max-height:70vh;
  }
  table{ border-collapse:separate; border-spacing:0; font-size:13px; width:max-content; min-width:100%; }
  thead{
    position:sticky; top:0; z-index:4;
  }
  thead th{
    background:var(--table-head-bg);
    border-bottom:1px solid var(--line);
    text-align:left;
    padding:10px 12px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
  }
  thead tr.group-row th{
    background:#eaebee;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-soft);
    font-weight:700;
    padding:6px 12px;
    border-bottom:none;
  }

  /* Мягкая цветовая разметка подразделов — только лёгкий тон в самой шапке группы
     и тонкая полоска-акцент под названиями столбцов, чтобы не перегружать интерфейс. */
  thead tr.group-row th[data-colgroup="personal"]{ background:#eef3fc; }
  thead tr.group-row th[data-colgroup="workData"]{ background:#eef8f1; }
  thead tr.group-row th[data-colgroup="potential"]{ background:#f5f0fb; }
  thead tr.group-row th[data-colgroup="development"]{ background:#fdf5ea; }
  thead tr.label-row th[data-colgroup="personal"]{ box-shadow:inset 0 -2px 0 #c9d9f5; }
  thead tr.label-row th[data-colgroup="workData"]{ box-shadow:inset 0 -2px 0 #c3e8cd; }
  thead tr.label-row th[data-colgroup="potential"]{ box-shadow:inset 0 -2px 0 #dccdf0; }
  thead tr.label-row th[data-colgroup="development"]{ box-shadow:inset 0 -2px 0 #f2ddb0; }

  .th-row{ display:flex; align-items:center; gap:5px; }
  .th-text{ overflow:hidden; text-overflow:ellipsis; }
  .filter-btn{
    position:relative;
    border:none; background:transparent; cursor:pointer;
    padding:3px; margin:0; border-radius:5px;
    color:#9a9ea9; display:inline-flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .filter-btn:hover{ color:var(--accent); background:var(--accent-soft); }
  .filter-btn.active{ color:var(--accent); }
  .filter-btn.active::after{
    content:''; position:absolute; top:1px; right:1px;
    width:6px; height:6px; border-radius:50%;
    background:var(--accent); border:1.5px solid var(--table-head-bg);
  }

  tbody td{
    border-bottom:1px solid var(--line);
    padding:6px 8px;
    vertical-align:middle;
  }
  tbody tr:hover td{ background:#f6f7f9; }
  tbody tr:nth-child(even) td{ background:#fafafb; }
  tbody tr:nth-child(even):hover td{ background:#f3f4f6; }

  col.hidden, th.hidden, td.hidden{ display:none; }

  .col-rownum, .col-fio{
    position:sticky; z-index:2; background:#fff;
  }
  .col-rownum{ left:0; width:44px; text-align:center; color:var(--ink-soft); font-weight:600;}
  .col-fio{ left:44px; min-width:200px; font-weight:600; }
  thead .col-rownum, thead .col-fio{ z-index:4; }
  tbody tr:nth-child(even) .col-rownum, tbody tr:nth-child(even) .col-fio{ background:#fafafb; }
  tbody tr:hover .col-rownum, tbody tr:hover .col-fio{ background:#f6f7f9; }

  .cell-auto{
    background:var(--auto-bg);
    color:var(--ink);
    padding:7px 10px;
    border-radius:var(--radius-sm);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:280px;
  }
  .cell-no-options{ color:var(--ink-soft); font-style:italic; }
  .cell-empty{
    color:#c3c6d4;
    font-style:italic;
    padding-left:10px;
  }
  input.cell-input, select.cell-input{
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:7px 9px;
    font-size:13px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
    min-width:130px;
    max-width:280px;
    outline:none;
  }
  select.cell-input{ border-color:#cfd3f5; }
  input.cell-input:focus, select.cell-input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  input[type="date"].cell-input{ border-color:#bfe3cf; min-width:150px; }

  .col-actions{ width:52px; text-align:center; }
  .row-remove-btn{
    width:28px; height:28px; border-radius:50%;
    border:1px solid var(--line); background:#fff; color:var(--ink-soft);
    font-size:14px; line-height:1; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .row-remove-btn:hover{ background:#fdeeef; border-color:#f3c3ca; color:var(--red); }

  /* "уже назначен" — строка заблокирована для редактирования, показывается только через
     переключатель "Показать назначенных". Лёгкая заливка + бейдж в ячейке ФИО, без
     кардинальной смены оформления — это всё ещё обычный резервист, просто с историческим
     статусом. */
  tr.row-locked{ background:var(--auto-bg); }
  tr.row-locked:hover{ background:var(--auto-bg); }
  .locked-badge{
    display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; color:#fff; background:var(--accent);
    border-radius:4px; padding:2px 6px; margin-right:6px; vertical-align:middle;
  }

  .table-foot{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
    padding:12px 16px; font-size:12.5px; color:var(--ink-soft);
    border-top:1px solid var(--line);
  }
  .table-foot-left{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .pagination-controls{ display:flex; align-items:center; gap:6px; }
  .pagination-btn{ padding:5px 10px; font-size:12px; min-width:30px; }
  .pagination-btn:disabled{ opacity:.4; cursor:not-allowed; }
  #paginationPageInfo{ font-size:12px; color:var(--ink-soft); white-space:nowrap; padding:0 2px; }
  .table-foot .role-switcher-select{
    border-color:var(--line); color:var(--ink); background:#fff; padding:5px 10px; font-size:12px;
  }
  .note{
    font-size:12.5px; color:var(--ink-soft); margin-top:10px; line-height:1.5;
  }
  .note b{ color:var(--ink); }

  @media (max-width:700px){
    .hero{ padding:20px 16px 4px; }
    .content{ padding:4px 14px 40px; }
  }

  /* ---------- FILTER POPOVER ---------- */
  .filter-popover{
    display:none;
    position:fixed; z-index:70;
    width:320px; max-height:340px;
    background:#fff; border-radius:var(--radius-md);
    border:1px solid var(--line);
    box-shadow:0 18px 50px rgba(15,15,40,0.28);
    flex-direction:column;
    overflow:hidden;
  }
  .filter-popover.open{ display:flex; }
  .filter-popover-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 12px; border-bottom:1px solid var(--line);
    font-size:13px; font-weight:600; color:var(--ink);
  }
  .filter-popover-search{ padding:8px 10px; border-bottom:1px solid var(--line); }
  .filter-popover-search input{
    width:100%; border:1px solid var(--line); border-radius:8px;
    padding:6px 9px; font-size:12.5px; outline:none; font-family:inherit; color:var(--ink);
  }
  .filter-popover-search input:focus{ border-color:var(--accent); }
  .filter-popover-list{ overflow-y:auto; padding:6px 4px; flex:1; }
  .filter-option{
    display:flex; align-items:center; gap:8px;
    padding:6px 8px; border-radius:6px; font-size:12.5px; cursor:pointer;
  }
  .filter-option:hover{ background:var(--auto-bg); }
  .filter-option input{ accent-color:var(--accent); width:14px; height:14px; flex-shrink:0; }
  .filter-option span{ white-space:normal; line-height:1.3; }
  .filter-empty{ text-align:center; color:var(--ink-soft); font-size:12px; padding:24px 10px; }

  /* ---------- DATE RANGE FILTER (для всех столбцов-дат) ---------- */
  .date-range-filter{ padding:12px; }
  .date-range-quick{
    display:flex; align-items:center; gap:8px;
    padding:8px 9px; border:1px solid var(--line); border-radius:var(--radius-sm);
    font-size:12.5px; color:var(--ink); cursor:pointer; margin-bottom:12px;
  }
  .date-range-quick:hover{ border-color:#b9c2d4; background:var(--auto-bg); }
  .date-range-quick input{ accent-color:var(--accent); width:14px; height:14px; }
  .date-range-fields{ display:flex; flex-direction:column; gap:8px; }
  .date-range-field label{ display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; }
  .date-range-field input{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:7px 9px; font-size:12.5px; font-family:inherit; color:var(--ink); outline:none;
  }
  .date-range-field input:focus{ border-color:var(--accent); }
  .date-range-hint{ font-size:11px; color:var(--ink-soft); margin-top:10px; line-height:1.4; }
  .colvis-group-label{
    display:flex; align-items:center; gap:7px;
    font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--ink-soft); font-weight:700; padding:8px 8px 4px 10px;
    border-left:3px solid transparent; margin-left:-2px;
    cursor:pointer; user-select:none;
  }
  .colvis-group-label input[type="checkbox"]{ accent-color:var(--accent); width:13px; height:13px; flex-shrink:0; }
  .colvis-group-label:hover{ color:var(--ink); }
  .colvis-group-label[data-colgroup="personal"]{ border-left-color:#a9c3ee; }
  .colvis-group-label[data-colgroup="workData"]{ border-left-color:#9fd6b0; }
  .colvis-group-label[data-colgroup="potential"]{ border-left-color:#c6a8e3; }
  .colvis-group-label[data-colgroup="development"]{ border-left-color:#e8bf72; }
  .filter-popover-foot{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 12px; border-top:1px solid var(--line);
  }
  .filter-popover-foot-btns{ display:flex; gap:8px; }
  .filter-popover-foot .ghost-btn{ padding:5px 11px; font-size:12px; }
  .filter-popover-count{ display:block; font-size:11.5px; color:var(--ink-soft); padding:0 12px 8px; }

  /* ---------- ИСТОРИЯ НАЗНАЧЕНИЙ — попап по наведению на столбец, список людей ---------- */
  .month-details-popover{
    display:none;
    position:fixed; z-index:70;
    width:270px; max-height:340px;

<script>
/* ===================== СОСТОЯНИЕ (загружается и сохраняется через API) ===================== */
let GROUPS = [];
let COLUMNS = [];
let POSITIONS = [];
let ACTIONS = [];
let reserveRows = [];
let EMPLOYEE_POOL = [];
let ROLES = [];
let positionCategories = []; // категории должностей — определяют доступные "Потенциальные должности"

let currentRoleId = ''; // '' = без ограничений (полный доступ), иначе id роли из ROLES
let showLockedRows = false; // "Показать назначенных" — по умолчанию выключено, видимость самого переключателя зависит от права canShowAssigned у роли

let hiddenColumns = new Set(); // столбцы, скрытые пользователем через "Настроить отображение столбцов" (по умолчанию пусто — показаны все)

// активные фильтры по столбцам: colKey -> Set выбранных значений
let columnFilters = {};
let openFilterCol = null;
let filterDraft = null; // черновик текущего попапа: Set (список значений) или {onlyFilled,from,to} (диапазон дат) — применяется только по кнопке "Применить"

// пагинация — чтобы не рендерить в DOM тысячи строк разом
let currentPage = 1;
let pageSize = 100;
let lastTotalPages = 1;

/** Список должностей, доступных для выбора в "Потенциальная должность" сотруднику с данной
 *  "Текущей должностью" — объединение потенциальных должностей всех категорий, куда входит
 *  currentPosition. Дублирует одноимённую функцию из columns.js (серверный модуль, недоступен
 *  напрямую в браузере) — логика намеренно простая, держать в двух местах не накладно. */
function getEligiblePotentialPositions(currentPosition, categories){
  const eligible = new Set();
  (categories || []).forEach(cat => {
    if (Array.isArray(cat.currentPositions) && cat.currentPositions.includes(currentPosition)){
      (cat.potentialPositions || []).forEach(p => eligible.add(p));
    }
  });
  return Array.from(eligible);
}

function applyState(data){
  reserveRows = data.reserveRows;
  EMPLOYEE_POOL = data.employeePool;
  ROLES = data.roles || [];
  positionCategories = data.positionCategories || [];
}

async function loadMetaAndState(){
  const meta = await fetchMeta();
  const st = await fetchState();
  GROUPS = meta.groups;
  COLUMNS = meta.columns;
  POSITIONS = meta.positions || [];
  ACTIONS = meta.actions || [];
  applyState(st);
}

/* ===================== ВИДЖЕТЫ ===================== */
let lastWidgetsRows = [];       // строки, по которым виджеты считались в последний раз — нужны,
                                 // чтобы смена финансового года не тянула за собой новый набор
                                 // строк по текущим фильтрам (это дело кнопки "Обновить виджеты")
let selectedFYEndYear = null;   // null = определять по сегодняшней дате; иначе — явный выбор пользователя
let selectedAssignmentType = 'Постоянное'; // тип назначения, учитываемый в виджете "История назначений"
let lastWidgetsData = null;     // последний результат computeWidgetData — нужен попапу по
                                 // наведению и кнопке "Выгрузить в excel" за весь период, чтобы
                                 // не пересчитывать заново, когда сам renderWidgets() уже
                                 // пересоздал разметку через innerHTML

/** Правильное склонение слова "день" по числу. */
function pluralDays(n){
  const abs = Math.abs(n) % 100;
  const last = abs % 10;
  if (abs > 10 && abs < 20) return 'дней';
  if (last === 1) return 'день';
  if (last >= 2 && last <= 4) return 'дня';
  return 'дней';
}

/** Оценка размера "потенциального" пула — целевая логика для этого расчёта такая:
 *
 *  Числитель виджета (уже посчитан выше, в positionCounts) — сотрудники РЕЗЕРВА,
 *  у которых potPos = эта должность.
 *
 *  Знаменатель — сотрудники ВСЕЙ компании (не только резерва и не только общего списка
 *  кандидатов — вообще все 15 000+), чья "Текущая должность" по категориям (см. раздел 6
 *  документации) допускает эту потенциальную должность, ЗА ВЫЧЕТОМ всех, кто уже находится
 *  в резерве — целиком, независимо от того, на какую конкретно должность нацелен каждый из
 *  них. Как только сотрудник попал в резерв, он перестаёт быть "потенциальным" и переходит
 *  в разряд уже занявших место резервистов — по любой из должностей, к которым он был
 *  допущен, а не только по той, куда он в итоге нацелился.
 *
 *  Один и тот же (пока ещё НЕ резервист) сотрудник компании может входить сразу в несколько
 *  знаменателей одновременно — например, продавец допущен сразу к 4 должностям по категории
 *  "Продающие", и пока он не в резерве, он учитывается в знаменателе всех четырёх.
 *
 *  У прототипа данных для настоящего расчёта нет физически — реестр знает только про тех,
 *  кто уже в резерве или в небольшом общем списке кандидатов, не про всех сотрудников
 *  компании. Здесь — чисто демонстрационная оценка, не настоящий подсчёт: число подобрано
 *  детерминированно по названию должности (одна и та же должность всегда даёт одно и то же
 *  число, не "скачет" при каждой перерисовке виджетов). Число намеренно всегда больше
 *  текущего числа резервистов — исключительно ради правдоподобного вида демо-цифр, а не
 *  потому что резервисты как-то входят в этот пул (наоборот — они из него как раз исключены,
 *  см. выше). */
function estimateEligiblePoolSize(positionLabel, currentCount){
  let hash = 0;
  for (let i = 0; i < positionLabel.length; i++){
    hash = (hash * 31 + positionLabel.charCodeAt(i)) >>> 0;
  }
  const coveredFraction = 0.12 + (hash % 1000) / 1000 * 0.18; // резерв покрывает 12–30% пула
  return Math.max(currentCount + 1, Math.round(currentCount / coveredFraction));
}

/** Считает все метрики дашборда по переданному набору строк (уже отфильтрованному —
 *  виджеты всегда показывают то, что попадает под текущие фильтры). Никаких обращений
 *  к серверу — вся нужная информация уже загружена на клиенте. */
function computeWidgetData(rows, forcedFYEndYear, forcedAssignmentType){
  // "locked" (уже назначенные) сюда тоже попадают (см. getWidgetsRows) — но не для всех
  // метрик их нужно учитывать одинаково. "Сотрудников в КР" и "КР по должностям" — это
  // про тех, кто СЕЙЧАС активно в резерве, поэтому только activeRows. А вот "Средний срок
  // пребывания" и "История назначений" опираются на даты (krDate/assignDate), которые
  // у уже назначенных людей не менее реальны — их не исключаем.
  const activeRows = rows.filter(r => r.values.trackState !== 'locked');

  // Сотрудников в КР — считаем УНИКАЛЬНЫХ людей (employeeId), а не строк: один человек
  // может занимать несколько строк одновременно (несколько треков развития), это не должно
  // задваивать счётчик.
  const total = new Set(activeRows.map(r => r.values.employeeId)).size;

  // Средний срок пребывания в КР — среднее число дней между "Дата зачисления КР" (krDate)
  // и "Дата назначения" (assignDate), только по строкам, где оба поля реально заполнены
  let daysSum = 0, daysCount = 0;
  rows.forEach(r => {
    const kr = r.values.krDate, assign = r.values.assignDate;
    if (kr && assign){
      const diffDays = Math.round((new Date(assign) - new Date(kr)) / (1000 * 60 * 60 * 24));
      daysSum += diffDays;
      daysCount++;
    }
  });
  const avgDays = daysCount > 0 ? Math.round(daysSum / daysCount) : null;

  // КР по должностям — считаем по "активной" потенциальной должности (row.values.potPos),
  // ровно по одной на сотрудника — той же самой, что показана в столбце "Потенциальная
  // должность" в таблице. НЕ по всей истории devTracks: там может быть несколько записей
  // (человек проходил разные программы в разное время), но для этого виджета важно, куда
  // сотрудник нацелен сейчас, а не сколько программ он когда-либо проходил — иначе сумма
  // по виджету превышала бы общее число сотрудников в резерве. Уже назначенные (locked)
  // сюда не входят — они не "сейчас развиваются", они уже пришли к цели.
  const positionCounts = {};
  activeRows.forEach(r => {
    const pos = r.values.potPos;
    if (!pos) return;
    positionCounts[pos] = (positionCounts[pos] || 0) + 1;
  });
  const positionList = Object.entries(positionCounts)
    .sort((a, b) => b[1] - a[1])
    .map(([label, count]) => ({ label, count, total: estimateEligiblePoolSize(label, count) }));

  // История назначений за финансовый год (сентябрь — август). Считаем только по одному
  // "Типу назначения" за раз — свой отдельный переключатель в самом виджете (по умолчанию
  // "Постоянное"), не связан с общими фильтрами таблицы над реестром.
  const assignmentType = forcedAssignmentType || 'Постоянное';
  const assignmentRows = rows.filter(r => r.values.assignment === assignmentType);

  const monthNames = ['Сен', 'Окт', 'Ноя', 'Дек', 'Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг'];

  const now = new Date();
  const curMonth = now.getMonth(); // 0 = январь ... 8 = сентябрь
  const autoFYEndYear = (curMonth >= 8 ? now.getFullYear() : now.getFullYear() - 1) + 1;

  // какие финансовые года вообще встречаются в данных (по "Дата назначения") — считаем
  // тоже только среди строк выбранного типа назначения, иначе список предлагал бы года,
  // в которых для этого типа назначения нет вообще ни одной записи
  const fyEndYearsWithData = new Set();
  assignmentRows.forEach(r => {
    const assign = r.values.assignDate;
    if (!assign) return;
    const d = new Date(assign);
    if (isNaN(d.getTime())) return;
    const y = d.getFullYear(), m = d.getMonth();
    fyEndYearsWithData.add(m >= 8 ? y + 1 : y);
  });
  const availableFYEndYears = Array.from(fyEndYearsWithData).sort((a, b) => b - a); // сначала свежие

  let fyEndYear = forcedFYEndYear
    || (availableFYEndYears.includes(autoFYEndYear) ? autoFYEndYear : availableFYEndYears[0])
    || autoFYEndYear;
  const fyStartYear = fyEndYear - 1;

  const monthRows = Array.from({ length: 12 }, () => []);
  assignmentRows.forEach(r => {
    const assign = r.values.assignDate;
    if (!assign) return;
    const d = new Date(assign);
    if (isNaN(d.getTime())) return;
    const y = d.getFullYear(), m = d.getMonth();
    let idx = -1;
    if (m >= 8 && y === fyStartYear) idx = m - 8;
    else if (m < 8 && y === fyStartYear + 1) idx = m + 4;
    if (idx >= 0 && idx < 12) monthRows[idx].push(r);
  });
  const monthCounts = monthRows.map(list => list.length);
  const periodRows = monthRows.flat(); // все строки текущего FY + типа назначения разом, для экспорта "за весь период"

  return {
    total,
    avgDays,
    positionList,
    monthNames,
    monthCounts,
    monthRows,
    periodRows,
    fyEndYear,
    availableFYEndYears: availableFYEndYears.length > 0 ? availableFYEndYears : [fyEndYear],
    assignmentType,
  };
}

function renderWidgets(rows, forcedFYEndYear, forcedAssignmentType){
  lastWidgetsRows = rows;
  const data = computeWidgetData(rows, forcedFYEndYear, forcedAssignmentType);
  selectedFYEndYear = data.fyEndYear; // фиксируем реально применённый год (после всех фолбэков)
  selectedAssignmentType = data.assignmentType;
  const el = document.getElementById('widgets');

  let positionsHtml;
  if (data.positionList.length === 0){
    positionsHtml = `<div class="position-empty">Пока никто не выбрал потенциальную должность</div>`;
  } else {
    // p.count (резервисты) и p.total (ещё не резервисты, но допущены по категории) — это
    // НЕ части одного целого, а два непересекающихся числа (см. комментарий у
    // estimateEligiblePoolSize выше). Ширина полоски ниже — не строгая доля от суммы,
    // а наглядное относительное сравнение: насколько число резервистов велико по
    // сравнению с ещё доступным пулом. Сумма p.count+p.total никогда не используется
    // как база для %, чтобы не создавать ложное впечатление "count из total".
    positionsHtml = data.positionList.slice(0, 6).map(p => `
      <div class="position-row">
        <span class="p-label">${escapeHtml(p.label)}</span>
        <div class="p-track"><div class="p-fill" style="width:${Math.round(p.count / p.total * 100)}%"></div></div>
        <span class="p-num">${p.count}<span class="p-num-total">/${p.total}</span></span>
      </div>
    `).join('');
  }

  const maxMonth = Math.max(1, ...data.monthCounts);
  const chartHtml = data.monthNames.map((name, i) => {
    const count = data.monthCounts[i];
    const heightPct = count > 0 ? Math.max(Math.round(count / maxMonth * 100), 4) : 2;
    return `
      <div class="fy-bar-col" data-month-idx="${i}">
        <span class="fy-bar-val">${count > 0 ? count : ''}</span>
        <div class="fy-bar${count === 0 ? ' zero' : ''}" style="height:${heightPct}%" title="${name}: ${count} — наведите для списка"></div>
        <span class="fy-bar-month">${name}</span>
      </div>
    `;
  }).join('');

  const fySelectHtml = data.availableFYEndYears.map(y =>
    `<option value="${y}" ${y === data.fyEndYear ? 'selected' : ''}>FY${String(y).slice(-2)}</option>`
  ).join('');

  const assignmentTypeOptions = [
    { value: 'Постоянное', label: 'Постоянные' },
    { value: 'Временное', label: 'Временные' },
  ];
  const assignmentSelectHtml = assignmentTypeOptions.map(o =>
    `<option value="${o.value}" ${o.value === data.assignmentType ? 'selected' : ''}>${o.label}</option>`
  ).join('');

  // сохраняем данные последнего расчёта, чтобы попап по наведению и кнопка "за весь период"
  // могли достать список строк без пересчёта — сам renderWidgets() каждый раз пересоздаёт
  // всю разметку виджетов через innerHTML, локальные ссылки на DOM/данные тут не выживут
  lastWidgetsData = data;

  el.innerHTML = `
    <div class="card card-tall">
      <div class="card-label">Кадровый резерв по должностям</div>
      <div class="position-list">${positionsHtml}</div>
    </div>

    <div class="card card-wide">
      <div class="card-label-row">
        <span class="card-label">История назначений</span>
        <span class="card-label-selects">
          <button class="period-export-btn" id="periodExportBtn" title="Выгрузить в Excel все строки текущего периода">Выгрузить в excel</button>
          <select class="fy-select" id="assignmentTypeSelect">${assignmentSelectHtml}</select>
          <select class="fy-select" id="fySelect">${fySelectHtml}</select>
        </span>
      </div>
      <div class="fy-chart">${chartHtml}</div>
    </div>

    <div class="card">
      <div class="card-label">Сотрудников в кадровом резерве</div>
      <div class="card-body-center"><div class="big-num">${data.total.toLocaleString('ru-RU')}</div></div>
    </div>

    <div class="card">
      <div class="card-label">Средний срок пребывания в кадровом резерве</div>
      <div class="card-body-center">
        <div class="sub-num">${data.avgDays !== null ? data.avgDays + ' ' + pluralDays(data.avgDays) : '—'}</div>
      </div>
    </div>

    <div class="card vacancies-card">
      <div class="card-label">Вакансии</div>
      <div class="card-body-center">
        <a class="vacancies-link-btn" href="https://sm-training.localcorp.net/career_tracks" target="_blank" rel="noopener">Перейти к вакансиям →</a>
      </div>
    </div>
  `;

  // оба выпадающих списка пересоздаются при каждой перерисовке (innerHTML), поэтому
  // обработчики навешиваем заново каждый раз. Смена года/типа назначения НЕ трогает
  // "Обновлено: чч:мм" и не пересчитывает заново по фильтрам таблицы — это просто другой
  // взгляд на уже посчитанные данные (lastWidgetsRows)
  document.getElementById('fySelect').addEventListener('change', e => {
    renderWidgets(lastWidgetsRows, parseInt(e.target.value, 10), selectedAssignmentType);
  });
  document.getElementById('assignmentTypeSelect').addEventListener('change', e => {
    // при смене типа назначения список доступных FY может быть другим для этого типа —
    // не передаём текущий forcedFYEndYear принудительно, даём computeWidgetData подобрать
    // подходящий год заново (текущий/самый свежий среди доступных для нового типа)
    renderWidgets(lastWidgetsRows, null, e.target.value);
  });
  document.getElementById('periodExportBtn').addEventListener('click', () => {
    const d = lastWidgetsData;
    const typeLabel = d.assignmentType === 'Постоянное' ? 'Постоянные' : 'Временные';
    exportRowsToExcel(d.periodRows, `История_назначений_FY${String(d.fyEndYear).slice(-2)}_${typeLabel}`);
  });
}

/* ===================== ТАБЛИЦА ===================== */
/* ===================== РОЛИ И ПРАВА ДОСТУПА ===================== */
/** Эффективные права на поле с учётом выбранной "роли просмотра" в реестре.
 *  Без выбранной роли — полный доступ (как в обычном режиме). */
function getEffectivePermission(colKey){
  if (!currentRoleId) return { view: true, edit: true };
  const role = ROLES.find(r => r.id === currentRoleId);
  if (!role) return { view: true, edit: true };
  return role.permissions[colKey] || { view: false, edit: false };
}

/** Эффективное право на действие (добавить/удалить сотрудника), не привязанное к полю.
 *  Без выбранной роли — полный доступ, как и для полей. */
function getEffectiveActionPermission(actionKey){
  if (!currentRoleId) return true;
  const role = ROLES.find(r => r.id === currentRoleId);
  if (!role) return true;
  return !!(role.actions && role.actions[actionKey]);
}

/** Показывает/скрывает кнопку "Добавить сотрудника" и кнопки удаления строк
 *  в зависимости от прав текущей выбранной роли на эти действия. */
function applyActionPermissions(){
  const canAdd = getEffectiveActionPermission('canAddEmployee');
  const addBtn = document.getElementById('addEmployeeBtn');
  if (addBtn) addBtn.style.display = canAdd ? '' : 'none';

  const canRemove = getEffectiveActionPermission('canRemoveEmployee');
  document.querySelectorAll('.row-remove-btn').forEach(btn => {
    btn.style.display = canRemove ? '' : 'none';
  });

  // "Показать назначенных" — сам переключатель виден только ролям с этим правом; если
  // роль сменилась и у неё этого права больше нет — принудительно выключаем и сам показ,
  // чтобы не оставить в интерфейсе строки, которые эта роль видеть не должна
  const canShowAssigned = getEffectiveActionPermission('canShowAssigned');
  const showAssignedBtn = document.getElementById('showAssignedBtn');
  if (showAssignedBtn){
    showAssignedBtn.style.display = canShowAssigned ? '' : 'none';
    if (!canShowAssigned && showLockedRows){
      showLockedRows = false;
    }
    showAssignedBtn.classList.toggle('active', showLockedRows);
    showAssignedBtn.textContent = showLockedRows ? 'Скрыть назначенных' : 'Показать назначенных';
  }
}

function applyColumnVisibility(){
  COLUMNS.forEach(col => {
    const roleAllowsView = getEffectivePermission(col.key).view;
    const userWantsVisible = !hiddenColumns.has(col.key);
    const visible = roleAllowsView && userWantsVisible;
    document.querySelectorAll(`[data-col="${col.key}"]`).forEach(cell => {
      cell.classList.toggle('hidden', !visible);
    });
  });

  // Заголовки самих ГРУПП столбцов ("Персональные данные" и т.п.) — отдельная сущность
  // от заголовков отдельных столбцов, applyColumnVisibility их до сих пор не трогала.
  // Если в группе не осталось ни одного видимого столбца — прячем заголовок группы целиком
  // (иначе он "нависает" над пустым местом), а если видна только часть — подгоняем colspan
  // под фактическое число видимых столбцов, а не под общее число столбцов в группе.
  GROUPS.forEach(g => {
    const cols = COLUMNS.filter(c => c.group === g.key);
    const visibleInGroup = cols.filter(c =>
      getEffectivePermission(c.key).view && !hiddenColumns.has(c.key)
    ).length;
    const groupTh = document.querySelector(`thead tr.group-row th[data-colgroup="${g.key}"]`);
    if (groupTh){
      groupTh.classList.toggle('hidden', visibleInGroup === 0);
      if (visibleInGroup > 0) groupTh.setAttribute('colspan', visibleInGroup);
    }
  });

  const visibleCount = COLUMNS.filter(c =>
    getEffectivePermission(c.key).view && !hiddenColumns.has(c.key)
  ).length;
  document.getElementById('visibleColCount').textContent = `${visibleCount} из ${COLUMNS.length}`;
  applyActionPermissions();
}

/* ===================== ВЫГРУЗКА ОТЧЁТА (Excel) ===================== */
/** Столбцы, которые реально видны сейчас — то же самое условие, что использует таблица
 *  для отрисовки (право роли на просмотр + столбец не спрятан через "Настроить отображение
 *  столбцов"). Отчёт выгружает именно их, в том же порядке, что и на экране. */
function getExportableColumns(){
  return COLUMNS.filter(col => getEffectivePermission(col.key).view && !hiddenColumns.has(col.key));
}

/** Значение ячейки для отчёта — то же самое, что видно на экране, но развёрнуто в чистый
 *  текст (без кнопок/попапов): для devRecords-столбцов через точку с запятой перечисляются
 *  ВСЕ должности сотрудника (а не только сводка "+N"), отсортированные по убыванию прогресса —
 *  так же, как показывает попап-расшифровка. */
function formatCellForExport(col, row){
  const value = row.values[col.key];

  if (col.type === 'devRecords'){
    // Экспортируем то же самое, что видно в ячейке — запись, активную для текущей
    // "Потенциальной должности", а не всю историю сотрудника
    const tracks = row.values.devTracks || [];
    const t = tracks.find(tr => tr.position === row.values.potPos);
    if (!t) return '—';
    if (col.recordField === 'hardDate') return t.hardDate ? formatIsoToRu(t.hardDate) : '—';
    if (col.recordField === 'program'){
      const pct = (t.percent !== '' && t.percent !== null && t.percent !== undefined) ? ` (${t.percent}%)` : '';
      return `${t.program || '—'}${pct}`;
    }
    return t[col.recordField] || '—';
  }

  if (col.type === 'date') return value ? formatIsoToRu(value) : '';
  // autoDate/select/free/auto/autoEditable/positionSelect/empty — уже хранятся в читаемом виде как есть
  return value === undefined || value === null ? '' : String(value);
}

/** Ширина столбца в отчёте — по факту самой длинной строки в нём (заголовок + все
 *  выгруженные значения), а не одинаковая для всех. Верхняя граница — чтобы одно
 *  аномально длинное значение не растянуло колонку на пол-экрана; нижняя — чтобы
 *  короткие столбцы вроде "Статус" не превращались в нечитаемую узкую полоску. */
function computeExportColWidths(headers, rows){
  return headers.map((header, colIdx) => {
    let maxLen = String(header || '').length;
    rows.forEach(row => {
      const len = String(row[colIdx] ?? '').length;
      if (len > maxLen) maxLen = len;
    });
    maxLen = Math.min(maxLen, 60);
    return { wch: Math.max(maxLen + 2, 8) };
  });
}

/** Общая выгрузка произвольного набора строк в Excel — тот же состав и порядок столбцов,
 *  что видно на экране (учитывая права роли и скрытые столбцы). Используется и основной
 *  кнопкой "Выгрузить отчёт" (весь текущий отфильтрованный список), и кнопками
 *  "Выгрузить в excel" в виджете "История назначений" — там набор строк уже не весь
 *  реестр, а конкретный месяц или весь выбранный период (год + тип назначения). */
function exportRowsToExcel(rows, filenameSuffix){
  const cols = getExportableColumns();
  const headers = cols.map(c => c.label);
  const aoa = [headers];
  rows.forEach(row => {
    aoa.push(cols.map(col => formatCellForExport(col, row)));
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = computeExportColWidths(headers, aoa.slice(1));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Кадровый резерв');

  const today = new Date();
  const dateTag = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const suffix = filenameSuffix ? `_${filenameSuffix}` : '';
  XLSX.writeFile(wb, `Кадровый_резерв${suffix}_${dateTag}.xlsx`);
}

function exportReport(){
  exportRowsToExcel(getFilteredRows()); // те же строки, что сейчас проходят поиск + все активные фильтры
}

function setupExportButton(){
  document.getElementById('exportReportBtn').addEventListener('click', exportReport);
}

/** Сортирует записи развития по убыванию процента прохождения — впереди должна быть
 *  связка с наибольшим прогрессом (и в сводке ячейки, и в попапе-расшифровке). */
function sortDevTracksByProgress(tracks){
  return [...tracks].sort((a, b) => (Number(b.percent) || 0) - (Number(a.percent) || 0));
}

/** Краткая сводка для ячейки devRecords: значение по нужному атрибуту записи с наибольшим
 *  прогрессом + "+N", если должностей у сотрудника несколько. Если задан summaryField —
 *  в ячейке показывается именно он (например, "89%"), а не то, по чему фильтруем (recordField).
 *  Полную расшифровку показывает попап по клику. */
function formatDevTrackSummary(col, tracks){
  const sorted = sortDevTracksByProgress(tracks);
  const top = sorted[0];
  const field = col.summaryField || col.recordField;
  let text;
  if (field === 'hardDate'){
    text = top.hardDate ? formatIsoToRu(top.hardDate) : '—';
  } else if (field === 'percent'){
    text = (top.percent !== '' && top.percent !== null && top.percent !== undefined) ? `${top.percent}%` : '—';
  } else {
    text = top[field] || '—';
  }
  if (tracks.length > 1 && col.showCount) text += ` +${tracks.length - 1}`;
  return text;
}

/** Строит HTML содержимого одной ячейки — переиспользуется и полной перерисовкой таблицы,
 *  и точечным обновлением одной ячейки после сохранения (см. updateCellDom), чтобы не
 *  дублировать логику типов полей в двух местах. */
function buildCellInnerHtml(col, row){
  const value = row.values[col.key];
  const perm = getEffectivePermission(col.key);
  // trackState:'locked' (сотрудник уже назначен) — строка полностью нередактируема,
  // независимо от прав роли на конкретное поле
  const canEdit = perm.edit && isEditableType(col.type) && row.values.trackState !== 'locked';
  let inner = '';
  switch(col.type){
    case 'auto':
    case 'autoDate':
      if (col.key === 'employeeComment' && value){
        // копится как многострочный текст (одна причина отказа — одна строка, через \n) —
        // в самой ячейке всё равно видна только первая строка/обрезанный текст, полный
        // текст открывается по клику в отдельном попапе, см. setupCommentPopover()
        inner = `<div class="cell-auto cell-comment" data-row="${row.id}" title="Клик — открыть полностью">${escapeHtml(value)}</div>`;
      } else {
        inner = `<div class="cell-auto" title="${escapeHtml(value || '')}">${value ? escapeHtml(value) : '—'}</div>`;
      }
      break;
    case 'select':
      inner = canEdit
        ? `<select class="cell-input" data-row="${row.id}" data-col="${col.key}">` +
            col.options.map(o => `<option ${o === value ? 'selected' : ''}>${o}</option>`).join('') +
          `</select>`
        : `<div class="cell-auto" title="${value}">${value || '—'}</div>`;
      break;
    case 'autoEditable':
      if (col.options){
        // автополе-снимок, но редактируется выбором из списка, а не свободным текстом
        inner = canEdit
          ? `<select class="cell-input" data-row="${row.id}" data-col="${col.key}">` +
              col.options.map(o => `<option ${o === value ? 'selected' : ''}>${o}</option>`).join('') +
            `</select>`
          : `<div class="cell-auto" title="${value}">${value || '—'}</div>`;
      } else {
        inner = canEdit
          ? `<input class="cell-input" type="text" data-row="${row.id}" data-col="${col.key}" value="${value === '—' ? '' : value}" placeholder="—">`
          : `<div class="cell-auto" title="${value}">${value || '—'}</div>`;
      }
      break;
    case 'positionSelect':
      {
        // "Потенциальная должность" — реально редактируемое значение, но список вариантов
        // не фиксированный, а зависит от "Текущей должности" сотрудника (см. категории
        // должностей на странице "Роли и доступы"). Уже выбранное значение всегда остаётся
        // в списке, даже если оно почему-то больше не входит в разрешённые — чтобы не
        // потерять данные молча, если категории поменялись уже после выбора.
        const eligible = getEligiblePotentialPositions(row.values.curPos, positionCategories);
        const optionsSet = new Set(eligible);
        if (value) optionsSet.add(value);
        const optionsList = Array.from(optionsSet);
        if (!canEdit){
          inner = `<div class="cell-auto" title="${escapeHtml(value || '—')}">${escapeHtml(value || '—')}</div>`;
        } else if (optionsList.length === 0){
          inner = `<div class="cell-auto cell-no-options" title="Для должности «${escapeHtml(row.values.curPos || '')}» пока не настроены доступные потенциальные должности — см. страницу «Роли и доступы»">Нет доступных должностей</div>`;
        } else {
          inner = `<select class="cell-input" data-row="${row.id}" data-col="${col.key}" data-position-select="1">` +
            (!value ? `<option value="" disabled selected>— выбрать —</option>` : '') +
            optionsList.map(o => `<option ${o === value ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('') +
          `</select>`;
        }
      }
      break;
    case 'devRecords':
      {
        // История прогресса сотрудника хранится в row.values.devTracks (может быть несколько
        // записей — по одной на каждую должность, где был прогресс), но в ячейке всегда
        // показываем только ту, что относится к текущей "активной" потенциальной должности
        // (row.values.potPos) — остальные остаются в истории и станут видны, если сотрудник
        // (через личный кабинет) или роль с правом редактирования сменят выбор в "Потенциальной
        // должности". Попап-расшифровка больше не нужен — активная запись всегда одна.
        const tracks = row.values.devTracks || [];
        const active = tracks.find(t => t.position === row.values.potPos);
        const summary = active ? formatDevTrackSummary(col, [active]) : '—';
        inner = `<div class="cell-auto" title="${escapeHtml(summary)}">${escapeHtml(summary)}</div>`;
      }
      break;
    case 'free':
      inner = canEdit
        ? `<input class="cell-input" type="text" data-row="${row.id}" data-col="${col.key}" value="${value === '—' ? '' : value}" placeholder="—">`
        : `<div class="cell-auto" title="${value}">${value || '—'}</div>`;
      break;
    case 'date':
      inner = canEdit
        ? `<input class="cell-input" type="date" data-row="${row.id}" data-col="${col.key}" value="${value}">`
        : `<div class="cell-auto">${value ? formatIsoToRu(value) : '—'}</div>`;
      break;
    case 'empty':
      inner = `<div class="cell-empty">—</div>`;
      break;
  }
  return inner;
}

/** Точечно обновляет DOM ровно одной ячейки, без перерисовки всей страницы — используется
 *  после сохранения одной ячейки. Полная перерисовка (renderTable) при 1000 строк на
 *  странице означает пересборку ~31 000 ячеек ради одного изменённого значения — именно
 *  это и вызывало ощутимые задержки при большом размере страницы пагинации. */
function updateCellDom(rowId, colKey){
  const row = reserveRows.find(r => r.id === rowId);
  const col = COLUMNS.find(c => c.key === colKey);
  if (!row || !col) return false;
  const td = document.querySelector(`tr[data-row="${rowId}"] td[data-col="${colKey}"]`);
  if (!td) return false; // строки нет на текущей странице — например, поменяли страницу, пока летел запрос
  td.innerHTML = buildCellInnerHtml(col, row);
  return true;
}

function renderTable(){
  const table = document.getElementById('mainTable');

  // group header row (spans)
  let groupCells = [`<th class="col-rownum" rowspan="2">#</th>`];
  GROUPS.forEach(g => {
    const cols = COLUMNS.filter(c => c.group === g.key);
    if (cols.length === 0) return;
    groupCells.push(`<th colspan="${cols.length}" data-colgroup="${g.key}">${g.label}</th>`);
  });
  groupCells.push(`<th class="col-actions" rowspan="2"></th>`);

  // label header row
  let labelCells = [];
  COLUMNS.forEach(col => {
    const cls = col.key === 'fio' ? ' class="col-fio"' : '';
    const filterBtn = col.key === 'fio' ? '' :
      `<button class="filter-btn${isFilterActive(columnFilters[col.key]) ? ' active' : ''}" data-filter-col="${col.key}" title="Фильтр по столбцу">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M4 5h16l-6.5 7.5V19l-3 1.5v-8z"/></svg>
      </button>`;
    labelCells.push(`<th${cls} data-col="${col.key}" data-colgroup="${col.group}"><span class="th-row"><span class="th-text">${col.label}</span>${filterBtn}</span></th>`);
  });

  let thead = `<thead>
    <tr class="group-row">${groupCells.join('')}</tr>
    <tr class="label-row">${labelCells.join('')}</tr>
  </thead>`;

  // body rows — только текущая страница отфильтрованных строк, а не весь reserveRows разом
  // (иначе при тысячах сотрудников рендер тысяч <tr> подвесит вкладку браузера)
  const filtered = getFilteredRows();
  const totalRows = filtered.length;
  const totalPages = Math.max(1, Math.ceil(totalRows / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;
  const startIdx = (currentPage - 1) * pageSize;
  const pageRows = filtered.slice(startIdx, startIdx + pageSize);

  let bodyRows = [];
  pageRows.forEach((row, i) => {
    const idx = startIdx + i;
    const isLocked = row.values.trackState === 'locked';
    let cells = [`<td class="col-rownum" data-col="__rownum">${idx + 1}</td>`];
    COLUMNS.forEach(col => {
      let fioClass = col.key === 'fio' ? ' col-fio' : '';
      let inner = buildCellInnerHtml(col, row);
      if (col.key === 'fio' && isLocked){
        inner = `<span class="locked-badge" title="Сотрудник уже назначен на эту должность — строка заблокирована">Назначен</span>` + inner;
      }
      cells.push(`<td class="${fioClass}" data-col="${col.key}">${inner}</td>`);
    });
    cells.push(`<td class="col-actions">${isLocked ? '' : `<button class="row-remove-btn" data-remove-row="${row.id}" title="Убрать из резерва">✕</button>`}</td>`);
    bodyRows.push(`<tr data-row="${row.id}"${isLocked ? ' class="row-locked"' : ''}>${cells.join('')}</tr>`);
  });

  table.innerHTML = thead + `<tbody>${bodyRows.join('')}</tbody>`;
  closeFilterPopover();
  updateRowCountAndPagination(totalRows, totalPages, startIdx, pageRows.length);
  syncTopScrollbarWidth();
}

/* синхронизация ввода пользователя с моделью данных, чтобы значения не терялись при перерисовке */
const cellSaveTimers = {};

function updateLocalCellValue(el){
  const row = reserveRows.find(r => r.id === el.dataset.row);
  if (row) row.values[el.dataset.col] = el.value;
}

async function saveCell(rowId, col, value){
  let success = false;
  try{
    // PATCH /api/reserve/:id теперь возвращает только изменённую строку, а не всё состояние —
    // правка ячейки не имеет побочных эффектов на другие строки, гонять по сети весь реестр
    // ради одного поля незачем (особенно заметно на больших объёмах)
    const result = await mutate(`/api/reserve/${encodeURIComponent(rowId)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ col, value }),
    });
    if (result && result.row){
      const idx = reserveRows.findIndex(r => r.id === rowId);
      if (idx !== -1) reserveRows[idx] = result.row;
    }
    success = true;
  } catch(err){
    // запрос не прошёл — ниже перерисуем таблицу из последнего известного состояния,
    // чтобы визуально откатить то, что пользователь успел ввести
  }

  if (success && !isFilterActive(columnFilters[col])){
    // точечное обновление одной ячейки — полная перерисовка всей страницы (table.innerHTML
    // заново) при большом размере страницы пагинации (например, 1000 строк × 31 столбец)
    // ощутимо дороже, чем нужно ради одного изменившегося поля, и именно она давала
    // заметные задержки при большом page size
    updateCellDom(rowId, col);
  } else {
    // ошибка запроса, либо по этому столбцу сейчас активен фильтр (новое значение могло
    // вывести строку из-под условий фильтра или, наоборот, ввести под них) — в обоих
    // случаях нужна полная перерисовка
    renderTable();
  }
  applyColumnVisibility();
}

function scheduleCellSave(rowId, col, value){
  const key = rowId + ':' + col;
  clearTimeout(cellSaveTimers[key]);
  cellSaveTimers[key] = setTimeout(() => saveCell(rowId, col, value), 600);
}

/** Смена "Потенциальной должности" — отдельная логика от обычного saveCell, потому что
 *  на сервере это затрагивает не только сам столбец potPos, но и историю devTracks (может
 *  понадобиться завести в ней новую запись). Обновляет локально сразу potPos и devTracks
 *  строки, затем точечно перерисовывает три связанных ячейки (Потенциальная должность,
 *  Обучение, Дата HARD) — Обучение и Дата HARD ведь показывают именно ту запись истории,
 *  что теперь стала активной. */
async function savePotentialPosition(rowId, newPosition){
  let success = false;
  try{
    const result = await mutate(`/api/reserve/${encodeURIComponent(rowId)}/potential-position`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ position: newPosition }),
    });
    if (result && result.row){
      const idx = reserveRows.findIndex(r => r.id === rowId);
      if (idx !== -1) reserveRows[idx] = result.row;
    }
    success = true;
  } catch(err){
    // запрос не прошёл (например, должность оказалась недопустимой) — ниже перерисуем
    // из последнего известного состояния, чтобы откатить визуально выбранное значение
  }

  const filterTouchesThisGroup = isFilterActive(columnFilters.potPos) || isFilterActive(columnFilters.training) || isFilterActive(columnFilters.hardDate);
  if (success && !filterTouchesThisGroup){
    updateCellDom(rowId, 'potPos');
    updateCellDom(rowId, 'training');
    updateCellDom(rowId, 'hardDate');
  } else {
    renderTable();
  }
  applyColumnVisibility();
}

function setupTableInputSync(){
  const table = document.getElementById('mainTable');

  // текстовые поля — сохраняем с задержкой, пока пользователь печатает
  table.addEventListener('input', e => {
    const el = e.target;
    if (!el.dataset.row || !el.dataset.col) return;
    if (el.tagName === 'INPUT' && el.type === 'text'){
      updateLocalCellValue(el);
      scheduleCellSave(el.dataset.row, el.dataset.col, el.value);
    }
  });

  // списки и даты — сохраняем сразу по выбору значения
  table.addEventListener('change', e => {
    const el = e.target;
    if (!el.dataset.row || !el.dataset.col) return;
    if (el.dataset.positionSelect){
      // "Потенциальная должность" — своя логика сохранения (см. savePotentialPosition),
      // локальное значение НЕ обновляем через updateLocalCellValue: там нужно поставить
      // не просто potPos, а ещё и, возможно, новую запись в devTracks — это сделает
      // savePotentialPosition после ответа сервера
      savePotentialPosition(el.dataset.row, el.value);
      return;
    }
    if (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type === 'date')){
      updateLocalCellValue(el);
      const key = el.dataset.row + ':' + el.dataset.col;
      clearTimeout(cellSaveTimers[key]);
      saveCell(el.dataset.row, el.dataset.col, el.value);
    }
  });

  table.addEventListener('click', e => {
    const removeBtn = e.target.closest('[data-remove-row]');
    if (removeBtn){ removeFromReserveRow(removeBtn.dataset.removeRow); return; }
    const devBtn = e.target.closest('.dev-records-btn');
    if (devBtn){ openDevTracksPopover(devBtn.dataset.devrow, devBtn); return; }
  });
}

/** Столбцы, где значение — дата: у них вместо списка чекбоксов показываем диапазон "с/по"
 *  плюс быстрый переключатель "Только заполненные" — кликать по каждой из сотен дат нереально. */
function isDateFilterColumn(col){
  return col.type === 'date' || col.type === 'autoDate' || (col.type === 'devRecords' && col.recordField === 'hardDate');
}

/** Активен ли фильтр столбца — работает и для Set (список значений), и для объекта-диапазона дат. */
function isFilterActive(filter){
  if (!filter) return false;
  if (filter instanceof Set) return filter.size > 0;
  return !!(filter.onlyFilled || filter.from || filter.to);
}

/** Подходит ли конкретное сырое значение под фильтр столбца — единая точка для Set и диапазона дат. */
function filterValueMatches(filter, rawValue){
  if (filter instanceof Set) return filter.has(rawValue);
  // диапазон дат: пустая дата никогда не проходит активный фильтр диапазона/"только заполненные"
  if (rawValue === '') return false;
  if (filter.from && rawValue < filter.from) return false;
  if (filter.to && rawValue > filter.to) return false;
  return true;
}

/** Подходит ли строка под текущий поиск по ФИО и все активные фильтры столбцов —
 *  единая точка правды, используется и при рендере страницы, и при подсчёте totalRows. */
function rowMatchesFilters(row, q){
  if (q && !(row.values.fio || '').toLowerCase().includes(q)) return false;

  for (const colKey in columnFilters){
    const filter = columnFilters[colKey];
    if (!isFilterActive(filter)) continue;
    const col = COLUMNS.find(c => c.key === colKey);
    let val;
    if (col && col.type === 'devRecords'){
      // Обучение / Дата HARD — значение берём из записи истории, которая сейчас "активна"
      // (совпадает с row.values.potPos), а не по всей истории целиком: фильтр должен
      // отражать именно то, что сейчас реально видно в ячейке, а не прошлые должности
      const tracks = row.values.devTracks || [];
      const active = tracks.find(t => t.position === row.values.potPos);
      val = active ? (active[col.recordField] || '').toString() : '';
    } else {
      val = (row.values[colKey] || '').toString();
    }
    if (!filterValueMatches(filter, val)) return false;
  }

  return true;
}

/** Полный отфильтрованный список (без учёта пагинации) — используется и для рендера
 *  текущей страницы, и для подсчёта totalRows/totalPages. */
/** Строки для основной таблицы: "removed" (удалённые треки) скрыты всегда — данные
 *  сохранены в базе, но в реестре их быть не должно. "locked" (уже назначенные) —
 *  скрыты по умолчанию, показываются только если включён переключатель "Показать
 *  назначенных" (сам переключатель виден только ролям с правом canShowAssigned). */
function getFilteredRows(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const canSeeLocked = showLockedRows && getEffectiveActionPermission('canShowAssigned');
  return reserveRows.filter(row => {
    if (row.values.trackState === 'removed') return false;
    if (row.values.trackState === 'locked' && !canSeeLocked) return false;
    return rowMatchesFilters(row, q);
  });
}

/** То же самое, но для виджетов — "removed" скрыты всегда, а вот "locked" (уже назначенные)
 *  ВСЕГДА учитываются, независимо от того, включён ли переключатель "Показать назначенных"
 *  в самой таблице: виджет "История назначений" обязан считать этих людей в любом случае
 *  (см. документацию), это не связано с тем, что сейчас видно в реестре визуально. */
function getWidgetsRows(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  return reserveRows.filter(row => {
    if (row.values.trackState === 'removed') return false;
    return rowMatchesFilters(row, q);
  });
}

/** Сбрасывает страницу на первую и перерисовывает — вызывается только там, где реально
 *  изменился набор фильтров/поиск (иначе, например, редактирование ячейки на 5-й странице
 *  отбрасывало бы пользователя обратно на первую). */
function applyRowFilters(){
  currentPage = 1;
  renderTable();
  applyColumnVisibility();
}

function updateRowCountAndPagination(totalRows, totalPages){
  lastTotalPages = totalPages;
  const rangeStart = totalRows === 0 ? 0 : (currentPage - 1) * pageSize + 1;
  const rangeEnd = Math.min(currentPage * pageSize, totalRows);
  let text = `Показано ${rangeStart}–${rangeEnd} из ${totalRows} строк`;
  if (totalRows !== reserveRows.length) text += ` (отфильтровано из ${reserveRows.length})`;
  document.getElementById('rowCount').textContent = text;
  document.getElementById('paginationPageInfo').textContent = `Стр. ${currentPage} из ${totalPages}`;
  document.getElementById('paginationPrev').disabled = currentPage <= 1;
  document.getElementById('paginationNext').disabled = currentPage >= totalPages;
}

/** Верхняя полоса прокрутки — просто пустой div такой же "виртуальной" ширины, как сама
 *  таблица, чтобы у нижнего скролла таблицы появился видимый двойник сверху и не приходилось
 *  листать вниз, чтобы до него добраться. */
function syncTopScrollbarWidth(){
  const table = document.getElementById('mainTable');
  const inner = document.getElementById('tableScrollTopInner');
  if (!table || !inner) return;
  inner.style.width = table.scrollWidth + 'px';
  // подстраховка: иногда браузер досчитывает реальную ширину таблицы только после
  // следующего кадра отрисовки (особенно на очень широких таблицах/много столбцов)
  requestAnimationFrame(() => { inner.style.width = table.scrollWidth + 'px'; });
}
function setupTopScrollSync(){
  const top = document.getElementById('tableScrollTop');
  const body = document.getElementById('tableScroll');
  let syncing = false;
  top.addEventListener('scroll', () => {
    if (syncing) return;
    syncing = true; body.scrollLeft = top.scrollLeft; syncing = false;
  });
  body.addEventListener('scroll', () => {
    if (syncing) return;
    syncing = true; top.scrollLeft = body.scrollLeft; syncing = false;
  });
  window.addEventListener('resize', syncTopScrollbarWidth);
}

function setupPagination(){
  document.getElementById('pageSizeSelect').value = String(pageSize);
  document.getElementById('pageSizeSelect').addEventListener('change', e => {
    pageSize = parseInt(e.target.value, 10) || 100;
    currentPage = 1;
    renderTable();
    applyColumnVisibility();
  });
  document.getElementById('paginationPrev').addEventListener('click', () => {
    if (currentPage <= 1) return;
    currentPage--;
    renderTable();
    applyColumnVisibility();
  });
  document.getElementById('paginationNext').addEventListener('click', () => {
    if (currentPage >= lastTotalPages) return;
    currentPage++;
    renderTable();
    applyColumnVisibility();
  });
}

/* ===================== ДОБАВЛЕНИЕ / УДАЛЕНИЕ СОТРУДНИКОВ ===================== */
async function removeFromReserveRow(rowId){
  const row = reserveRows.find(r => r.id === rowId);
  if (!row) return;

  // убираем именно ЭТОТ трек (одну должность) — у сотрудника может быть ещё несколько
  // других активных строк, их это не касается; в общий список кандидатов он попадёт,
  // только если это был последний оставшийся у него активный/заблокированный трек
  const hasOtherTracks = reserveRows.some(r =>
    r.id !== rowId && r.values.employeeId === row.values.employeeId && r.values.trackState !== 'removed'
  );
  const consequence = hasOtherTracks
    ? 'Остальные его треки развития это не затронет.'
    : 'Это его последний трек — сотрудник вернётся в общий список кандидатов.';
  const ok = confirm(`Убрать «${row.values.fio}» с трека «${row.values.potPos}»?\n${consequence}`);
  if (!ok) return;

  try{
    applyState(await mutate(`/api/reserve/${encodeURIComponent(rowId)}`, { method: 'DELETE' }));
  } catch(err){
    return;
  }
  renderTable();
  applyColumnVisibility();
  renderPoolList(document.getElementById('poolSearchInput').value);
}

/** Список тех, кого вообще можно сейчас добавить (создать новый трек): и тех, кто ещё
 *  ни разу не в резерве (общий список кандидатов), и тех, кто уже резервист, но не по
 *  всем допустимым для него должностям — им можно завести дополнительный трек. У каждого
 *  кандидата — свой список ОСТАВШИХСЯ допустимых должностей (без тех, что уже заняты
 *  активным или заблокированным треком). Кандидаты вообще без допустимых должностей
 *  (currentPos не входит ни в одну категорию, либо все допустимые уже заняты) в список
 *  не попадают — добавлять им нечего. */
function getAddableCandidates(){
  const candidates = [];

  EMPLOYEE_POOL.forEach(p => {
    const eligible = getEligiblePotentialPositions(p.curPos, positionCategories);
    if (eligible.length > 0){
      candidates.push({ employeeId: p.employeeId, fio: p.fio, curPos: p.curPos, city: p.city, shop: p.shop, eligible });
    }
  });

  const byEmployee = {};
  reserveRows.forEach(r => {
    if (r.values.trackState === 'removed') return; // не занимает "слот" — можно добавить ту же должность заново
    const empId = r.values.employeeId;
    if (!byEmployee[empId]) byEmployee[empId] = { sample: r, taken: new Set() };
    byEmployee[empId].taken.add(r.values.potPos);
  });
  Object.entries(byEmployee).forEach(([empId, info]) => {
    const curPos = info.sample.values.curPos;
    const eligible = getEligiblePotentialPositions(curPos, positionCategories).filter(p => !info.taken.has(p));
    if (eligible.length > 0){
      candidates.push({
        employeeId: empId, fio: info.sample.values.fio, curPos,
        city: info.sample.values.city, shop: info.sample.values.shop, eligible,
      });
    }
  });

  candidates.sort((a, b) => a.fio.localeCompare(b.fio, 'ru'));
  return candidates;
}

/* ===================== ФИЛЬТРЫ ПО СТОЛБЦАМ ===================== */
function getColumnValueUniverse(col){
  if (col.type === 'select' || (col.type === 'autoEditable' && col.options)) return col.options.slice();
  if (col.type === 'devRecords'){
    // Обучение / Дата HARD — значение только из активной записи (той, что сейчас видна
    // в ячейке), иначе в списке фильтра появлялись бы значения из прошлых/неактивных
    // должностей, по которым фильтр всё равно никогда не найдёт совпадений
    const set = new Set();
    reserveRows.forEach(r => {
      const tracks = r.values.devTracks || [];
      const active = tracks.find(t => t.position === r.values.potPos);
      if (active) set.add((active[col.recordField] || '').toString().trim());
    });
    return Array.from(set).sort((a,b) => a.localeCompare(b,'ru'));
  }
  const set = new Set();
  reserveRows.forEach(r => set.add((r.values[col.key] || '').toString().trim()));
  return Array.from(set).sort((a,b) => a.localeCompare(b,'ru'));
}
function valueLabel(col, v){
  if (v === '') return '(не заполнено)';
  if (col.type === 'date' || col.type === 'autoDate') return formatIsoToRu(v);
  if (col.type === 'devRecords' && col.recordField === 'hardDate') return formatIsoToRu(v);
  return v;
}
function renderFilterOptions(col, searchQ){
  const universe = getColumnValueUniverse(col);
  const q = (searchQ || '').trim().toLowerCase();
  const selected = filterDraft instanceof Set ? filterDraft : new Set();
  const filtered = universe.filter(v => !q || valueLabel(col, v).toLowerCase().includes(q));
  const list = document.getElementById('filterPopoverList');
  list.innerHTML = filtered.length === 0
    ? `<div class="filter-empty">Ничего не найдено</div>`
    : filtered.map(v => `
        <label class="filter-option">
          <input type="checkbox" data-filter-value value="${escapeHtml(v)}" ${selected.has(v) ? 'checked' : ''}>
          <span>${escapeHtml(valueLabel(col, v))}</span>
        </label>
      `).join('');
  updateFilterSelCount();
}

/** UI для столбцов-дат: быстрый переключатель "только заполненные" + диапазон "с/по".
 *  Вместо списка из сотен отдельных дат — то, что реально нужно при масштабе в тысячи сотрудников. */
function renderDateRangeFilter(col){
  const filter = (filterDraft && !(filterDraft instanceof Set)) ? filterDraft : { onlyFilled:false, from:'', to:'' };
  const list = document.getElementById('filterPopoverList');
  list.innerHTML = `
    <div class="date-range-filter">
      <label class="date-range-quick">
        <input type="checkbox" id="dateRangeOnlyFilled" ${filter.onlyFilled ? 'checked' : ''}>
        <span>Только заполненные (без учёта конкретной даты)</span>
      </label>
      <div class="date-range-fields">
        <div class="date-range-field">
          <label for="dateRangeFrom">С</label>
          <input type="date" id="dateRangeFrom" value="${filter.from || ''}">
        </div>
        <div class="date-range-field">
          <label for="dateRangeTo">По</label>
          <input type="date" id="dateRangeTo" value="${filter.to || ''}">
        </div>
      </div>
      <div class="date-range-hint">Оставьте оба поля пустыми, чтобы не ограничивать период — тогда переключатель выше покажет все заполненные даты. Значения читаются только по кнопке «Применить».</div>
    </div>
  `;
  updateFilterSelCount();
}

function updateFilterSelCount(){
  const el = document.getElementById('filterPopoverSelCount');
  if (filterDraft instanceof Set){
    el.textContent = filterDraft.size > 0 ? `Выбрано: ${filterDraft.size}` : 'Показаны все';
  } else if (filterDraft && (filterDraft.onlyFilled || filterDraft.from || filterDraft.to)){
    const parts = [];
    if (filterDraft.from) parts.push('с ' + formatIsoToRu(filterDraft.from));
    if (filterDraft.to) parts.push('по ' + formatIsoToRu(filterDraft.to));
    el.textContent = parts.length ? parts.join(' ') : 'Только заполненные';
  } else {
    el.textContent = 'Показаны все';
  }
}
function updateFilterButtonState(colKey){
  const active = isFilterActive(columnFilters[colKey]);
  document.querySelectorAll(`[data-filter-col="${colKey}"]`).forEach(btn => btn.classList.toggle('active', active));
}
function openFilterPopover(colKey, btnEl){
  const col = COLUMNS.find(c => c.key === colKey);
  if (!col) return;
  closeColumnVisibilityPopover();
  closeDevTracksPopover();
  openFilterCol = colKey;

  const isDateRange = isDateFilterColumn(col);
  document.getElementById('filterPopoverSearchWrap').style.display = isDateRange ? 'none' : '';
  document.getElementById('filterPopoverSearch').value = '';

  // черновик заводим от уже применённого фильтра (если был) — чтобы попап открывался
  // с текущим состоянием, а не пустым, но саму таблицу это никак не трогает, пока не
  // нажали "Применить"
  const existing = columnFilters[colKey];
  if (isDateRange){
    filterDraft = (existing && !(existing instanceof Set)) ? { ...existing } : { onlyFilled:false, from:'', to:'' };
    renderDateRangeFilter(col);
  } else {
    filterDraft = existing instanceof Set ? new Set(existing) : new Set();
    renderFilterOptions(col, '');
  }

  const popover = document.getElementById('filterPopover');
  popover.classList.add('open');

  popover.style.left = Math.max(12, left) + 'px';
  popover.style.top = top + 'px';
  if (!isDateRange) document.getElementById('filterPopoverSearch').focus();
}
function closeFilterPopover(){
